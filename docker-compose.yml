# UniAssist production stack on one Linux server.
#   docker compose up -d --build                      → app + db + redis (web on APP_PORT, default 3100)
#   COMPOSE_PROFILES=https   → also Caddy on ports 80/443 with automatic HTTPS for $DOMAIN
#   COMPOSE_PROFILES=tunnel  → also Cloudflare Tunnel (no open ports / port forwarding needed)
# deploy/install.sh sets this up for you.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://uniassist:${POSTGRES_PASSWORD}@postgres:5432/uniassist
      REDIS_URL: redis://redis:6379
      WHATSAPP_AUTH_DIR: /app/data/whatsapp-auth
      STORAGE_DIR: /app/data/files
      PORT: "3000"
    ports:
      # The web page; bound to all interfaces so a reverse proxy on the host (or the LAN) can reach it.
      - "${APP_PORT:-3100}:3000"
    volumes:
      - appdata:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: uniassist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: uniassist
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uniassist"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

  # HTTPS for the public agenda page (automatic Let's Encrypt certificate).
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      - app

  # Public access without opening ports on the router (domain must be on Cloudflare).
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app

volumes:
  appdata:
  pgdata:
  redisdata:
  caddydata:
